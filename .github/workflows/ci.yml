name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, UI smoke test and quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Quality gates and debug build
        run: ./gradlew ktlintCheck :engine:jvmTest :composeApp:testDebugUnitTest :composeApp:lintDebug :composeApp:assembleDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator debug build and launch test
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select an available iPhone simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, items in devices.items() if "iOS" in runtime for d in items if "iPhone" in d["name"] and d.get("isAvailable")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          print(phones[0]["udid"])
          ')
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Test common engine on the selected iOS simulator
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            engine_target=iosSimulatorArm64Test
          else
            engine_target=iosX64Test
          fi
          ./gradlew ":engine:$engine_target" -PiosSimulatorId="$SIMULATOR_ID" --stacktrace
      - name: Build and launch-test unsigned debug app
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath iosApp/DerivedData \
            -resultBundlePath iosApp/build/LaunchTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            iosApp/build/LaunchTests.xcresult
            engine/build/reports/tests/
            engine/build/test-results/
